[package]
name = "mtgsim"
version = "0.1.0"
edition = "2024"
# The measured floor, not the edition's: 1.88.0 built every target and passed
# the whole suite on 2026-09-15 and again on 2026-10-22 (2,754 tests, every
# target at zero warnings), and the tree cannot go lower because its
# let-chains are stable only from 1.88 on. CI builds on the pinned toolchain in
# `.github/workflows/ci.yml`, not on this one; what this field gates is a
# build on an older toolchain (cargo refuses) and clippy's `incompatible_msrv`
# lint on a std API newer than 1.88. A later syntax floor is not caught by
# either — re-measure it when the pin moves.
rust-version = "1.88"
# The build script, under a name that does not read as `CardDataBuilder::build`:
# it stamps the commit into the binary for the trace sink's header (see the
# file's own doc). Cargo's default name is `build.rs`; this key is the rename.
build = "stamp_commit.rs"

[dependencies]
rand = "0.9"

[features]
# Shared test helpers (`src/test_support.rs`), visible to both the `src/` unit tests
# and the `tests/` integration tests. Off by default, so it does not ship in a
# release build.
test-support = []

# `cargo clippy --all-targets -- -D warnings` is a CI step. Adopted 2026-09-15
# (the post-RE audit, pass 2) the way handoff §6 decision 2 asked: run once and
# counted first — 114 sites, 26 lints, 48 files on 1.98.0 — and only then
# decided. Every lint but the five below was fixed in that PR. None of the five
# names a refactor the code owes; each is the lint disagreeing with a choice
# the code made on purpose, and the reason is beside it. Allow a sixth here,
# with its reason, rather than at the site. Each count below is a re-count
# with that lint's allow removed, dated: a count nothing recomputes goes stale
# (four of the five had moved by 2026-10-08, and four again by 2026-10-22,
# `engineering-practices.md#the-comment-sweep`).
[lints.clippy]
# 16 sites (2026-10-22). A performer, an `ask_*` or a rules check takes the
# board, the actor, the event and each bound as its own parameter on purpose;
# a parameter struct is a signature change at every caller and hides which
# bound a site forgot. Two are the fuzz harness's runners, which take each
# command-line option the same way. The one to revisit is
# `DecisionProvider::allocate`, and Phase 10 does, when it serializes the
# choice surface.
too_many_arguments = "allow"
# 7 sites (2026-10-22). `Effect` is the one whose size costs anything: every
# ability atom is one, and a push copies its def's tree, so boxing the big
# variant would add an allocation to every copy. `Rewrite`,
# `GameActionTemplate`, `CopyException`, `CharacteristicEdit`,
# `explain::StepResult` and the harness's `GameOutcome` have dozens of live
# values per game, so their size is nothing.
large_enum_variant = "allow"
# 4 sites (2026-10-22). `ContinuousEffectRegistry`, `DurationRegistry`,
# `ScriptedDecisionProvider` and `RecorderHandle` are built by `new()` and
# nothing calls `default()`; `cargo clippy --fix` writes the impl, and an impl
# with no caller is dead code.
new_without_default = "allow"
# 10 sites (2026-10-22), five in tests. A `type` alias used once is a second
# name for one thing (`engineering-practices.md#one-line-wrappers`); the tuple
# is read where it is written.
type_complexity = "allow"
# 3 sites (2026-10-22). A row of the dependency matrix is a component number
# and an index into a mana bag is a mana type — the index is the identity —
# and the `enumerate()` rewrite does not borrow-check where `board.rs` reads
# row k while writing row i.
needless_range_loop = "allow"

# Refused, not allowed: a constructor says what it builds (`IdMap::default()`,
# not `Default::default()`, which hid the hasher's seed), the owner's rule at
# #158's and #248's reviews. An empty value that is a claim is a named constant
# instead (`ObjectSet::NO_OBJECTS`, `DecisionLogHandle::NONE`), which is review's.
default_trait_access = "warn"

[dev-dependencies]
# A dependency on ourselves, purely to turn `test-support` on for test builds.
# Integration tests link the crate as an external dependency and so cannot see
# `#[cfg(test)]` items; this is what lets one copy of a helper serve both sides.
# `cargo test` and `cargo build --all-targets` enable the feature; a plain
# `cargo build` does not build dev-dependencies at all, so the module is excluded.
mtgsim = { path = ".", features = ["test-support"] }

# CI's checked fuzz sitting: release's optimization with the debug build's
# checks. A release build compiles out every `debug_assert!`, and with them the
# layer walk's and the memo's audits, the mana watcher's and the pipeline's, so
# the release sittings play their games past every guard written that way.
[profile.release-checked]
inherits = "release"
debug-assertions = true
overflow-checks = true
