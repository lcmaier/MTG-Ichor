# Correctness only. This workflow deliberately does not gate on any timing
# number: shared runners vary 2-3x run to run, so a performance gate here would
# be flake rather than signal. The performance-pool A/B stays a local measurement at
# `--threads 1` — see `plans/engineering-practices.md` §3.1.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # `cargo build --all-targets` printing zero warnings is a hard bar in
  # CLAUDE.md. This is what turns it into a failure rather than a convention.
  # It reaches dependencies too, which is an accepted risk at 13 crates in the
  # whole tree: a future compiler making `uuid` or `rand` warn would fail a
  # build for something outside this repo. Move to a `[lints]` table in
  # Cargo.toml if that ever actually happens.
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mtgsim
    steps:
      - uses: actions/checkout@v5

      # Pinned rather than `stable`, because an unpinned toolchain turns a
      # GitHub image bump into a build break with no commit to blame.
      #
      # 1.98 is the version this repo is developed and verified on, and it is
      # not the floor. **The floor was measured 2026-09-15: 1.88.0** builds
      # every target with zero warnings and passes the whole suite, and the
      # tree cannot go lower — its let-chains are stable only from 1.88 on
      # edition 2024, so the edition's own 1.85 does not build it. That number
      # is `rust-version` in Cargo.toml. The pin stays at 1.98 on purpose: the
      # clippy step below was counted on 1.98's lint set, and a lint gate is
      # only meaningful on the toolchain it was sized against. Re-measure the
      # floor when this pin moves.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mtgsim

      - name: Build (zero warnings is the bar)
        run: cargo build --all-targets

      - name: Test
        run: cargo test

      # Adopted 2026-09-15 (the post-RE audit, pass 2) the way handoff §6
      # decision 2 asked: run once and counted first — 114 sites, 26 lints, 48
      # files on 1.98.0 — and only then decided. Everything was fixed except
      # five design lints, allowed in Cargo.toml's `[lints.clippy]` table with
      # one reason each; a new allow goes there, with its reason, never at the
      # site. `-D warnings` here is what `RUSTFLAGS` above already does, spelled
      # out so a local `cargo clippy --all-targets -- -D warnings` is the same
      # gate. Clippy lints are advisory by design — this step is what makes the
      # default set a bar instead of a suggestion.
      #
      # `cargo fmt --check` is NOT here, and the cost is why: measured the same
      # day, it would change 148 of 165 Rust files in 2,441 hunks, with no
      # `rustfmt.toml` in the tree. Adopting it means one whole-tree reformat
      # commit first, which rewrites every file's blame — the project leans on
      # its per-commit record. That is the owner's switch to throw; if it is,
      # the reformat is its own PR and this step is
      # `run: cargo fmt --check` beside the clippy one.
      - name: Clippy (the default lint set is a bar)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build the fuzz harness
        run: cargo build --release --bin fuzz_games

      # Floors 2 and 3 (`plans/engineering-practices.md` §3.1): what one clone
      # of a Commander game allocates, at item 143's checkpoints, against 64
      # allocations and 128 KB. Release, because a debug build's layer-memo
      # audit re-walks every hit: 675 s there against 0.26 s here, and about
      # 15 s of build beside the harness's.
      - name: Clone bound — allocations and bytes per clone
        run: cargo test --release --test clone_bound_test

      # The scenario writer's round trip over played boards
      # (`plans/setup-architecture.md` §4.3): 32 games, about 1.5 s here and
      # 40 s in debug, for the same reason as the step above. Two games run
      # in the debug `cargo test`.
      - name: Scenario round trip — boards written, loaded and compared
        run: cargo test --release --test scenario_round_trip_test

      # `fuzz_games` exits 1 on panics or errors, so the exit code is the gate
      # and nothing here parses output. Threaded on purpose: the harness's own
      # header says coverage wants threads (6.7x) and precision does not matter
      # for a pass/fail sweep.
      #
      # Turn-limit hits are NOT a failure. A 200-turn game is a loop symptom,
      # but it is also what a legitimately stalled board looks like, so gating
      # on it would trade a real signal for a flaky one. The count is printed;
      # watch it, and promote it to a failure if it ever moves off zero for a
      # reason anyone can name.
      - name: Fuzz — performance pool
        run: cargo run --release --bin fuzz_games -- --games 200 --seed 12345

      - name: Fuzz — stress pool (every registered card)
        run: cargo run --release --bin fuzz_games -- --games 200 --seed 12345 --pool stress

      # Everything outside `=== Timing ===` is byte-identical across runs at one
      # seed. Three runs rather than two: two agreeing can still both be wrong
      # in the same way, and the harness has a documented reproducibility
      # contract to hold up.
      #
      # A different hasher seed per run, on purpose. Ids are process-stable
      # (A4g, 2026-09-16) and the id-keyed maps hash with `types::ids::IdHash`,
      # so under one seed every map iterates in the same order in every
      # process and a sweep that leaks that order into a decision would agree
      # with itself three times. Three seeds give the check back the property
      # it had under `RandomState`: an unordered sweep shows up as a diff.
      #
      # Each run's second half starts every game from the template's board,
      # whose setup action casts a Bolt first, so the scenario loader and the
      # setup driver are under the same check (`setup-architecture.md` §8).
      - name: Determinism — three runs at one seed, three hasher seeds
        run: |
          for i in 1 2 3; do
            { MTGSIM_HASH_SEED="$i" cargo run --release --bin fuzz_games -- --games 50 --seed 12345
              MTGSIM_HASH_SEED="$i" cargo run --release --bin fuzz_games -- --games 20 --seed 12345 \
                --scenario scenarios/template.scenario
            } | sed '/^=== Timing ===$/,/^$/d' > "run$i.txt"
          done
          diff run1.txt run2.txt
          diff run1.txt run3.txt

      # Stdlib-only Python, so no install step. This is the CLAUDE.md 200-line
      # budget and nothing else — the spec database is deliberately not a gate
      # here (owner call, 2026-08-31: `plans/` is largely generated and its
      # labels are not trusted enough to block a merge).
      - name: CLAUDE.md line budget
        working-directory: .
        run: python3 plans/check_claude_md.py

      # A `mod.rs` declares and re-exports; it does not define. Held by
      # convention alone for two years and then broken twice in two phases,
      # which is the definition of a rule that needs a mechanism.
      - name: Module layout
        working-directory: .
        run: python3 plans/check_module_layout.py

      # `plans/glossary.md` states facts about the tree — that a term exists,
      # that a code anchor still resolves — and a doc that states facts with
      # nothing re-reading it goes stale in the commit that renames something.
      # This is the re-reader, and it is also the American-spelling gate on the
      # crate (`CLAUDE.md`, Conventions). One of the four checks CLAUDE.md says
      # must pass, and the one that was missing here until 2026-09-15.
      # Stdlib-only, like the others; `plans/` spellings are reported, not
      # failed — that doc tree carries pre-existing forms whose sweep is its own
      # diff.
      - name: Glossary and spelling
        working-directory: .
        run: python3 plans/check_glossary.py

      # `plans/state-of-play.md` is generated from the tree, so a stale board is
      # a diff. It also fails when CLAUDE.md's critical path calls a phase
      # "next" that an architecture doc records as landed — the exact drift that
      # made roadmap-v2 §2 unusable as a quick reference (2026-09-03). Reads
      # files only: no git, no gh, no spec.sqlite, so a shallow checkout here
      # produces the same bytes as a local run.
      - name: State of play
        working-directory: .
        run: python3 plans/check_state_of_play.py --check

      # A ruling a registered card carries and no test names
      # (`engineering-practices.md` §3.4a). Offline like the rest: the
      # ledger is checked in, the fetch that refreshes it is manual, and
      # `--check` reads the ledger and the `// RULING:` annotations only.
      # So drift — Scryfall adding a ruling to a card that was correct
      # when it was registered — fails in the pull request that re-fetches,
      # and never in one whose branch touched nothing.
      - name: Rulings ledger
        working-directory: .
        run: python3 plans/check_rulings.py --check

      # A run of spaces in the middle of a message is a lost `\` line
      # continuation, and this tree had thirty of them when the gate was
      # written — a class of defect that only ever shows up in a panic or an
      # `Err` somebody is already reading because something went wrong.
      - name: String literals
        working-directory: .
        run: python3 plans/check_string_literals.py

      # Every field `GameState` holds is named in `cr-coverage-audit.md` §4b,
      # beside the type-surface pass that read it. That document promised the
      # sweep "the day a type joins GameState", and the promise lapsed while
      # the state went from 28 fields to 52. Reads two files, nothing else.
      - name: Type surface
        working-directory: .
        run: python3 plans/check_type_surface.py

      # An inline `allow(clippy::X)` for a lint Cargo.toml's `[lints.clippy]`
      # already allows silences nothing, and it outlives the table's entry: the
      # day the table drops X to revisit it, the inline allow still hides its
      # site. The clippy step's comment above says where an allow goes.
      - name: Clippy allows
        working-directory: .
        run: python3 plans/check_clippy_allows.py

      # `plans/engine-map.md` is where a reader starts, and a map of a moving
      # tree rots without a sound. This fails when its arm table stops being
      # `GameAction`'s variants, or when it names a file, a function, a trace
      # page or a doc section that no longer exists. A line that merely moved
      # since the map's pin is reported, not failed. Reads files only.
      - name: Engine map
        working-directory: .
        run: python3 plans/check_engine_map.py

      # The dev GUI's rule, logic in plain Rust under tests and egui only
      # drawing (`engineering-practices.md` §10.2): no file but the drawing
      # files names a window crate, and no drawing file names the engine.
      # GUI code is what a review can least read line by line, so the line
      # between the two is held here. Reads files only.
      - name: egui only draws
        working-directory: .
        run: python3 plans/check_egui_only_draws.py

  # The dev GUI (`devgui/`), a crate beside the engine with its own lockfile
  # and target. A job of its own, so it runs beside `check` and is never the
  # long pole: its cold build measured 49 s at four jobs in WSL (2026-09-30),
  # about 75 s on a runner. `--locked` fails rather than re-resolve a
  # dependency, so new code reaches the tree only through a lockfile diff.
  #
  # The review pictures are not compared here. They are drawn on the owner's
  # machine, and one drawn by Linux's software renderer differs past
  # egui_kittest's threshold (a probe: 222 of 8,528 pixels, one over).
  devgui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devgui
    steps:
      - uses: actions/checkout@v5

      # The engine's pin, for the engine's reasons above; the GUI's own floor
      # is eframe 0.36's, 1.95.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: devgui

      - name: Build (zero warnings is the bar)
        run: cargo build --all-targets --locked

      - name: Clippy (the default lint set is a bar)
        run: cargo clippy --all-targets --locked -- -D warnings

      # The view model's and the board editor's tests, and whole games with
      # a thread in the window's place, by a fixed rule and by seeded random
      # clicks, the editor's beside them (about 24 s of debug build: the
      # layer memo's audit runs in it, which is how the random clicks found
      # an engine bug). `tests/screenshots.rs` is the local check above.
      - name: Test, without the pictures
        run: cargo test --locked --lib --test headless_game --test random_clicks
