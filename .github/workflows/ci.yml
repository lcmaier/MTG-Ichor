# Correctness only. This workflow deliberately does not gate on any timing
# number: shared runners vary 2-3x run to run, so a performance gate here would
# be flake rather than signal. The performance-pool A/B stays a local measurement at
# `--threads 1` — see `plans/engineering-practices.md#the-close-out`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job reads the repository and writes nothing.
permissions:
  contents: read

# A new push to a PR supersedes the run already going. A push to main runs
# whole, since its result is the record of that commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # `cargo build --all-targets` printing zero warnings is a hard bar in
  # CLAUDE.md. This is what turns it into a failure rather than a convention.
  # It reaches dependencies too, which is an accepted risk at 13 crates in the
  # whole tree: a future compiler making `uuid` or `rand` warn would fail a
  # build for something outside this repo. Move to a `[lints]` table in
  # Cargo.toml if that ever actually happens.
  RUSTFLAGS: -D warnings

# Actions are pinned by commit, since a tag can be moved under a repository
# that trusts it. `.github/dependabot.yml` proposes the bumps. `--locked` on
# every cargo step fails rather than re-resolve a dependency, so new code
# reaches the tree only through a lockfile diff.
#
# `debug`, `release` and `gates` run beside each other, so a run takes as long
# as the slowest of them rather than all three.
jobs:
  debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mtgsim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the next step can diff against the base.
          fetch-depth: 0

      - name: Changed outside the docs?
        id: changes
        uses: ./.github/actions/changed-outside-docs

      # Pinned rather than `stable`, because an unpinned toolchain turns a
      # GitHub image bump into a build break with no commit to blame.
      #
      # 1.98 is the version this repo is developed and verified on, and it is
      # not the floor. **The floor is 1.88.0**, measured 2026-09-15 and again
      # 2026-10-22: it builds every target with zero warnings and passes the
      # whole suite, and the tree cannot go lower — its let-chains are stable
      # only from 1.88 on edition 2024, so the edition's own 1.85 does not
      # build it. That number is `rust-version` in Cargo.toml. The pin stays at
      # 1.98 on purpose: the clippy step below was counted on 1.98's lint set,
      # and a lint gate is only meaningful on the toolchain it was sized
      # against. Re-measure the floor when this pin moves.
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        if: steps.changes.outputs.code == 'true'
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.code == 'true'
        with:
          workspaces: mtgsim

      # CLAUDE.md's first bar: every target — the library, the binaries, the
      # tests and the examples — under `RUSTFLAGS` above, so a warning in a
      # test file fails as one in the engine does. A step of its own, so a
      # compile error reads as one rather than as a test run that never
      # started.
      - name: Build (zero warnings is the bar)
        if: steps.changes.outputs.code == 'true'
        run: cargo build --all-targets --locked

      # Debug, on purpose: every `debug_assert!` runs, and with them the layer
      # walk's and the memo's audits. A test that would take minutes under
      # those is release-only (`cfg_attr(debug_assertions, ignore)`) and has
      # a step in the `release` job.
      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: cargo test --locked

      # Adopted 2026-09-15 (the post-RE audit, pass 2) the way handoff §6
      # decision 2 asked: run once and counted first — 114 sites, 26 lints, 48
      # files on 1.98.0 — and only then decided. Everything was fixed except
      # five design lints, allowed in Cargo.toml's `[lints.clippy]` table with
      # one reason each; a new allow goes there, with its reason, never at the
      # site. One lint outside the default set is raised into it the same way,
      # `default_trait_access` (2026-10-14). `-D warnings` here is what
      # `RUSTFLAGS` above already does, spelled out so a local `cargo clippy
      # --all-targets -- -D warnings` is the same gate. Clippy lints are
      # advisory by design — this step is what makes the table a bar instead
      # of a suggestion.
      #
      # `cargo fmt --check` is NOT here, and the cost is why: measured the same
      # day, it would change 148 of 165 Rust files in 2,441 hunks, with no
      # `rustfmt.toml` in the tree. Adopting it means one whole-tree reformat
      # commit first, which rewrites every file's blame — the project leans on
      # its per-commit record. That is the owner's switch to throw; if it is,
      # the reformat is its own PR and this step is
      # `run: cargo fmt --check` beside the clippy one.
      - name: Clippy (the default lint set is a bar)
        if: steps.changes.outputs.code == 'true'
        run: cargo clippy --all-targets --locked -- -D warnings

  # What a game does on an optimized build: the bounds, the sittings and the
  # determinism check.
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mtgsim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the next step can diff against the base.
          fetch-depth: 0

      - name: Changed outside the docs?
        id: changes
        uses: ./.github/actions/changed-outside-docs

      # The `debug` job's pin, for its reasons.
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        if: steps.changes.outputs.code == 'true'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.code == 'true'
        with:
          workspaces: mtgsim

      # The release build every step below shares, made once so its minutes
      # are this step's and not the first sitting's, and so a harness that
      # does not compile fails here rather than inside a fuzz step.
      - name: Build the fuzz harness
        if: steps.changes.outputs.code == 'true'
        run: cargo build --locked --release --bin fuzz_games

      # Floors 2 and 3 (`plans/engineering-practices.md#the-floors`): what one
      # clone of a Commander game allocates, against 64 allocations and 128 KB,
      # at item 143's checkpoints and every decision, and on the fixture boards
      # no seed reaches (an 8,000-trigger stack, a token churn); and what a fork
      # copies between two decisions (`plans/clone-architecture.md` decision 6).
      # Release, because a debug build's layer-memo audit re-walks every hit:
      # 675 s there against about a second here, and about 40 s of build beside
      # the harness's.
      - name: Clone bound — allocations and bytes per clone
        if: steps.changes.outputs.code == 'true'
        run: cargo test --locked --release --test clone_bound_test --test clone_fixture_test --test fork_copies_test

      # The memory a game's history log holds, which no clone copies: at most
      # about 5 KB a turn over every game together, on the clone tests' games
      # (`history_held_test.rs`'s own doc). Release-only for the same reason,
      # and it ran nowhere until 2026-10-22; 0.7 s here.
      - name: History bound — what a game's log holds per turn
        if: steps.changes.outputs.code == 'true'
        run: cargo test --locked --release --test history_held_test

      # The scenario writer's round trip over played boards
      # (`plans/setup-architecture.md` §4.3): 32 games, about 1.5 s here and
      # 40 s in debug, for the same reason as the step above. Two games run
      # in the debug `cargo test`.
      - name: Scenario round trip — boards written, loaded and compared
        if: steps.changes.outputs.code == 'true'
        run: cargo test --locked --release --test scenario_round_trip_test

      # `fuzz_games` exits 1 on panics or errors, so the exit code is the gate
      # and nothing here parses output. Threaded on purpose: the harness's own
      # header says coverage wants threads (6.7x) and precision does not matter
      # for a pass/fail sweep.
      #
      # Turn-limit hits are NOT a failure. A 200-turn game is a loop symptom,
      # but it is also what a legitimately stalled board looks like, so gating
      # on it would trade a real signal for a flaky one. The count is printed;
      # watch it, and promote it to a failure if it ever moves off zero for a
      # reason anyone can name.
      - name: Fuzz — performance pool
        if: steps.changes.outputs.code == 'true'
        run: cargo run --locked --release --bin fuzz_games -- --games 200 --seed 12345

      # The same sweep over every registered card, so a card no `performance`
      # deck holds is still played: that pool changes only on purpose, so its
      # readings compare across PRs
      # (`engineering-practices.md#cards-and-pools`), and this one is where a
      # new card's paths are met.
      - name: Fuzz — stress pool (every registered card)
        if: steps.changes.outputs.code == 'true'
        run: cargo run --locked --release --bin fuzz_games -- --games 200 --seed 12345 --pool stress

      # Everything outside `=== Timing ===` is byte-identical across runs at one
      # seed. Three runs rather than two: two agreeing can still both be wrong
      # in the same way, and the harness has a documented reproducibility
      # contract to hold up.
      #
      # A different hasher seed per run, on purpose. Ids are process-stable
      # (A4g, 2026-09-16) and the id-keyed maps hash with `types::ids::IdHash`,
      # so under one seed every map iterates in the same order in every
      # process and a sweep that leaks that order into a decision would agree
      # with itself three times. Three seeds give the check back the property
      # it had under `RandomState`: an unordered sweep shows up as a diff.
      #
      # Each run's second half starts every game from the template's board,
      # whose setup action casts a Bolt first, so the scenario loader and the
      # setup driver are under the same check (`setup-architecture.md` §8).
      - name: Determinism — three runs at one seed, three hasher seeds
        if: steps.changes.outputs.code == 'true'
        run: |
          for i in 1 2 3; do
            { MTGSIM_HASH_SEED="$i" cargo run --locked --release --bin fuzz_games -- --games 50 --seed 12345
              MTGSIM_HASH_SEED="$i" cargo run --locked --release --bin fuzz_games -- --games 20 --seed 12345 \
                --scenario scenarios/template.scenario
            } | sed '/^=== Timing ===$/,/^$/d' > "run$i.txt"
          done
          diff run1.txt run2.txt
          diff run1.txt run3.txt

  # The Python checks. None runs cargo, so this job has no Rust toolchain, and
  # most of them read the docs, so a docs-only pull request runs them all.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Stdlib-only Python, so no install step. This is the CLAUDE.md 200-line
      # budget and nothing else — the spec database is deliberately not a gate
      # here (owner call, 2026-08-31: `plans/` is largely generated and its
      # labels are not trusted enough to block a merge).
      - name: CLAUDE.md line budget
        run: python3 plans/check_claude_md.py

      # A `mod.rs` declares and re-exports; it does not define. Held by
      # convention alone for two years and then broken twice in two phases,
      # which is the definition of a rule that needs a mechanism.
      - name: Module layout
        run: python3 plans/check_module_layout.py

      # `plans/glossary.md` states facts about the tree — that a term exists,
      # that a code anchor still resolves — and a doc that states facts with
      # nothing re-reading it goes stale in the commit that renames something.
      # This is the re-reader, and it is also the American-spelling gate on the
      # crate (`CLAUDE.md`, Conventions). The one of CLAUDE.md's checks that
      # was missing here until 2026-09-15.
      # Stdlib-only, like the others; `plans/` spellings are reported, not
      # failed — that doc tree carries pre-existing forms whose sweep is its own
      # diff.
      - name: Glossary and spelling
        run: python3 plans/check_glossary.py

      # `plans/state-of-play.md` is generated from the tree, so a stale board is
      # a diff. It also fails when CLAUDE.md's critical path calls a phase
      # "next" that an architecture doc records as landed — the exact drift that
      # made roadmap-v2 §2 unusable as a quick reference (2026-09-03), on an
      # open Deferred Migrations item with no home, and on an item number used
      # twice. Reads files only: no git, no gh, no spec.sqlite, so a shallow
      # checkout here produces the same bytes as a local run.
      - name: State of play
        run: python3 plans/check_state_of_play.py --check

      # A ruling a registered card carries and no test names
      # (`engineering-practices.md#the-ledger-and-its-gate`). Offline like the
      # rest: the ledger is checked in, the fetch that refreshes it is manual,
      # and `--check` reads the ledger and the `// RULING:` annotations only. So
      # drift — Scryfall adding a ruling to a card that was correct when it was
      # registered — fails in the pull request that re-fetches, and never in one
      # whose branch touched nothing.
      - name: Rulings ledger
        run: python3 plans/check_rulings.py --check

      # A run of spaces in the middle of a message is a lost `\` line
      # continuation, and this tree had thirty of them when the gate was
      # written — a class of defect that only ever shows up in a panic or an
      # `Err` somebody is already reading because something went wrong.
      - name: String literals
        run: python3 plans/check_string_literals.py

      # Every field `GameState` holds is named in `cr-coverage-audit.md` §4b,
      # beside the type-surface pass that read it. That document promised the
      # sweep "the day a type joins GameState", and the promise lapsed while
      # the state went from 28 fields to 52. Reads two files, nothing else.
      - name: Type surface
        run: python3 plans/check_type_surface.py

      # An inline `allow(clippy::X)` for a lint Cargo.toml's `[lints.clippy]`
      # already allows silences nothing, and it outlives the table's entry: the
      # day the table drops X to revisit it, the inline allow still hides its
      # site. The clippy step's comment above says where an allow goes.
      - name: Clippy allows
        run: python3 plans/check_clippy_allows.py

      # `plans/engine-map.md` is where a reader starts, and a map of a moving
      # tree rots without a sound. This fails when its arm table stops being
      # `GameAction`'s variants, or when it names a file, a function, a trace
      # page or a doc section that no longer exists. A line that merely moved
      # since the map's pin is reported, not failed. Reads files only.
      - name: Engine map
        run: python3 plans/check_engine_map.py

      # The dev GUI's rule, logic in plain Rust under tests and egui only
      # drawing (`engineering-practices.md#the-dev-gui`): no file but the
      # drawing files names a window crate, and no drawing file names the
      # engine. GUI code is what a review can least read line by line, so the
      # line between the two is held here. Reads files only.
      - name: egui only draws
        run: python3 plans/check_egui_only_draws.py

      # Three of CLAUDE.md's invariants, read off the source
      # (`engineering-practices.md#invariant-gates`): a printed characteristic
      # read outside `oracle/`, an iteration over a hash field of `GameState`,
      # and a write of a field whose change is an event outside the file that
      # performs it. Each fails unless a tag in the source says why the rule
      # does not apply there; the known violations are listed in the script by
      # item. Review held these alone, and each was broken again within weeks of
      # being written. Reads files only.
      - name: Invariants
        run: python3 plans/check_invariants.py

      # The practices page stays a page of rules, under its line budget, and a
      # citation of a doc's section names a heading that exists: a section
      # number says nothing about where it leads, and an anchor that names no
      # heading leads nowhere. Reads files only.
      - name: Practices page and section anchors
        run: python3 plans/check_practices_page.py

      # Plants a violation of each rule in a throwaway worktree and fails if its
      # gate lets it through, since a rotted pattern reads as a clean pass.
      - name: The gates bite
        run: python3 plans/check_gates_bite.py

  # The guards a release build compiles out, played over every registered card:
  # each `debug_assert!`, and with them the layer walk's and the memo's audits,
  # the mana watcher's and the pipeline's
  # (`engineering-practices.md#the-checked-sitting`). The `release` job's
  # sittings play past all of them. A job of its own, beside that one rather
  # than after it, because the audits make a game about a hundred times
  # slower: 200 stress games took 25 s here against 0.21 s in release at 16
  # threads (2026-10-13). So this plays the first 50 of the same seed's games,
  # 14 s at four threads.
  fuzz-checked:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mtgsim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the next step can diff against the base.
          fetch-depth: 0

      - name: Changed outside the docs?
        id: changes
        uses: ./.github/actions/changed-outside-docs

      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        if: steps.changes.outputs.code == 'true'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.code == 'true'
        with:
          workspaces: mtgsim

      # `release-checked` is Cargo.toml's profile for this: release's
      # optimization with debug assertions and overflow checks back on.
      - name: Fuzz — stress pool, debug assertions on
        if: steps.changes.outputs.code == 'true'
        run: cargo run --locked --profile release-checked --bin fuzz_games -- --games 50 --seed 12345 --pool stress

      # Every card and the castable fixtures
      # (`engineering-practices.md#cards-and-pools`), played only here, where
      # the debug checks their builds carry fire.
      - name: Fuzz — fixture pool, debug assertions on
        if: steps.changes.outputs.code == 'true'
        run: cargo run --locked --profile release-checked --bin fuzz_games -- --games 50 --seed 12345 --pool fixtures

  # The dev GUI (`devgui/`), a crate beside the engine with its own lockfile
  # and target. A job of its own, so it runs beside the engine's.
  #
  # The review pictures are drawn on the owner's machine only. Here their
  # boards are played and the window run without drawing: one drawn by Linux's
  # software renderer differs past egui_kittest's threshold (a probe: 222 of
  # 8,528 pixels, one over), so a picture drawn here could be compared with
  # none.
  devgui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devgui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the next step can diff against the base.
          fetch-depth: 0

      - name: Changed outside the docs?
        id: changes
        uses: ./.github/actions/changed-outside-docs

      # The engine's pin, for the engine's reasons above; the GUI's own floor
      # is eframe 0.36's, 1.95.
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        if: steps.changes.outputs.code == 'true'
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.code == 'true'
        with:
          workspaces: devgui

      # The engine's first bar on the GUI crate: every target under
      # `RUSTFLAGS`, which this job inherits from the workflow.
      - name: Build (zero warnings is the bar)
        if: steps.changes.outputs.code == 'true'
        run: cargo build --all-targets --locked

      # The engine's clippy bar, read against the GUI crate's own
      # `[lints.clippy]` table in `devgui/Cargo.toml`.
      - name: Clippy (the default lint set is a bar)
        if: steps.changes.outputs.code == 'true'
        run: cargo clippy --all-targets --locked -- -D warnings

      # The view model's and the board editor's tests, whole games with a
      # thread in the window's place, by a fixed rule and by seeded random
      # clicks, the editor's beside them, the tools (undo, savestates, the
      # save and `--load`) and the why panel on short boards (about 25 s of
      # debug build: the layer memo's audit runs in it, which is how the
      # random clicks found an engine bug). `tests/screenshots.rs` is the
      # next step.
      - name: Test, without the pictures
        if: steps.changes.outputs.code == 'true'
        run: cargo test --locked --lib --test headless_game --test random_clicks --test tools --test why_panel

      # `tests/screenshots.rs` plays each review board to its picture's
      # question (`codebase-state.md` item 216) and runs the window to the
      # frame each picture shows, so what fails here is a board that stops
      # reaching its question, as MA-1's games made one do on `main` for a
      # day, or the window panicking on one. `SKIP_SNAPSHOTS` draws none, so
      # the job needs no GPU and no Vulkan driver.
      - name: The review boards, played to each picture's frame
        if: steps.changes.outputs.code == 'true'
        run: SKIP_SNAPSHOTS=true cargo test --locked --test screenshots
