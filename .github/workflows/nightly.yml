# The sweep `ci.yml` cannot be. Every CI sweep plays seed 12345, so code that
# has not changed never meets a new board. This one plays a new seed each night
# with debug assertions and the trigger audit on, and a failure here is a game
# nobody has seen. `plans/engineering-practices.md#the-nightly-sweep` says what
# to do with one.
name: Nightly sweep

# The cron is UTC, with no time zone to set, and it is when GitHub queues the
# run, not when it starts: the first eight nights started 6 h 46 min to 10 h
# 15 min after their cron. So the run is queued at 00:23 UTC, 7:23 pm Eastern
# the evening before (8:23 pm in daylight time), for a start between about 2
# and 6 am Eastern and a result by morning. 2:23 am Eastern itself would be
# 07:23 UTC, 06:23 in daylight time. If the start does not follow the cron,
# no cron gives a morning run: a scheduler outside GitHub calling
# `workflow_dispatch` would, or the run is a midday one.
#
# Not before 00:00 UTC: tonight's seed is the UTC day the run starts on, so a
# run that could start either side of midnight could play one day's games
# twice.
on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Master seed, to replay a night (default is tonight's)
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  sweep:
    runs-on: ubuntu-latest
    # About twice the longest night below, so a hang stops rather than a slow
    # night.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mtgsim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: mtgsim

      - name: Build the checked harness
        run: cargo build --locked --profile release-checked --bin fuzz_games

      # A game's seed is the master seed plus its index, so seeds a day apart
      # would replay nearly all of yesterday's games, shifted by one. The day
      # number times a million keeps every night's games apart.
      - name: Tonight's seed
        env:
          INPUT_SEED: ${{ inputs.seed }}
        run: |
          seed="${INPUT_SEED:-$(( $(date -u +%s) / 86400 * 1000000 ))}"
          echo "MASTER_SEED=$seed" >> "$GITHUB_ENV"
          echo "MTGSIM_HASH_SEED=$seed" >> "$GITHUB_ENV"
          echo "Master seed $seed"

      # 7 to 32 minutes a night over the first eight (2026-11-06 to 11-13),
      # 15 at the median, each night's seeds being new: the four-seat sweep
      # took 3 to 23 minutes, the two-seat one 2 to 6, the fixtures 1 to 3 and
      # the build under one. A failed sweep leaves the others running, so one
      # failure hides nothing.
      - name: Sweep — stress pool, two seats
        run: target/release-checked/fuzz_games --games 300 --seed "$MASTER_SEED" --pool stress --audit

      - name: Sweep — stress pool, four seats at Commander scale
        if: ${{ !cancelled() }}
        run: target/release-checked/fuzz_games --games 30 --seed "$MASTER_SEED" --pool stress --audit --players 4 --deck-size 100 --life 40

      - name: Sweep — fixture pool
        if: ${{ !cancelled() }}
        run: target/release-checked/fuzz_games --games 100 --seed "$MASTER_SEED" --pool fixtures --audit
