[package]
name = "devgui"
version = "0.1.0"
edition = "2024"
# eframe 0.36's floor. `mtgsim` keeps its own 1.88: it does not depend on this.
rust-version = "1.95"

[dependencies]
mtgsim = { path = "../mtgsim" }
# Without the screen-reader bridge (a D-Bus stack on Linux), link opening and
# the web screen reader, none of which the dev GUI uses: 439 locked packages to 359.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
# eframe's defaults turned on winit's, which Linux needs: Wayland loaded at run
# time, and title bars on GNOME. Named here to keep them; it moves with eframe.
winit = "0.30"
# `mtgsim::cards::random_deck` takes the engine's `StdRng`, so the same major.
rand = "0.9"

[dev-dependencies]
# The engine's own board builders (`mtgsim::test_support`), for tests only.
mtgsim = { path = "../mtgsim", features = ["test-support"] }
# Draws the window offscreen for the pictures in `tests/snapshots/`.
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }

# The engine lightly optimized in a debug build, where cards are tested: its
# debug checks, the layer memo's audit among them, stay on, and it runs about
# 8× faster, for about a second more per engine rebuild
# (`setup-architecture.md` §7b, decision 5). `cargo test` in `mtgsim/` reads
# that crate's own manifest, so it is unchanged.
[profile.dev.package.mtgsim]
opt-level = 1
